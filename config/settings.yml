# ============================================================
# Personal Intelligence Terminal — settings
# Editable. The cloud routine reads this file at the start of
# every run. See docs/SPEC.md for the authoritative product spec.
# ============================================================

schedule:
  # Times are local to `timezone` (24-hour HH:MM).
  # NOTE: changing these values does NOT reschedule anything by itself —
  # the cron expressions on the cloud routine must be updated to match
  # (see docs/RUNBOOK.md, "DST bump" / schedule-change procedure).
  weekday_learn: "06:00"  # Mon-Fri Learning Brief (strictly learning, no news)
  weekday_am: "06:30"     # Mon-Fri Morning Brief
  weekday_pm: "16:30"     # Mon-Fri Closing Brief
  saturday: "09:00"       # Weekly Review
  sunday: "09:00"         # Week Ahead
  timezone: America/New_York

# ------------------------------------------------------------
# Local coverage (shared-rules §18). Three beats, each reported
# in its own right, up to two items each, never padded.
# ------------------------------------------------------------
local:
  home: "Bridgeville, PA"
  beats:
    - "Bridgeville · South Fayette · South Hills"
    - "Pittsburgh · Allegheny County"
    - "Pennsylvania"
  max_items_per_beat: 2
  weather:
    # National Weather Service gridpoint for Bridgeville, PA.
    # Free, no key. Requires the .gov User-Agent header.
    latitude: 40.3565
    longitude: -80.1120
    office: PBZ
    morning_only: true

report:
  # Target story count for the Top Stories section — flexible by news
  # environment (don't pad, don't suppress).
  top_stories_target: "8-12"
  # Include the labeled ~2-minute executive brief near the top of every report.
  two_minute_mode: true

site:
  base_url: https://shafferusa.github.io/intelligence-terminal/

# ------------------------------------------------------------
# Breaking-news alerts (BUILT 2026-08-16).
# .github/workflows/breaking-alerts.yml + scripts/breaking_alerts.py
#
# NEWS ONLY — Logan's instruction. The market-move thresholds that
# used to live here are gone: he does not want a push because VIX
# jumped, he wants a push when something big happens in the world.
#
# The alert is deliberately minimal: BREAKING — headline, plus a
# link (WSJ preferred). No summary, no analysis. He reads the actual
# story in the next morning or closing brief.
#
# These values document the behaviour; they are currently constants
# in the script rather than read from this file.
# ------------------------------------------------------------
alerts:
  enabled: false              # switched off 2026-08-17 at Logan's request ("not needed");
                              # the cron in breaking-alerts.yml is commented out, manual dispatch remains
  method: cross-source corroboration + topic gate   # no LLM call, no API key
  min_newsrooms: 3            # independent outlets carrying the same event
  min_newsrooms_severe: 2     # lowered when the SEVERITY list matches
  window_minutes: 90          # how recent an item must be to count
  similarity: 0.35            # Jaccard overlap that means "same story"
  link_preference: [WSJ, CNBC, BBC, Guardian, NPR, CBS, Sky News, Al Jazeera, Deutsche Welle]
  cooldown_minutes: 20        # never two pushes closer together than this
  max_per_day: 6
  quiet_hours:
    start: "23:00"            # ET; only SEVERITY-flagged events get through
    end: "06:30"
