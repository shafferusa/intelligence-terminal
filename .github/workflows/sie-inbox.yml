name: Telegram inbox (SIE quiz answers, CFA study reports)

# Logan answers the SIE Program's quizzes by messaging the bot. Telegram only
# keeps undelivered bot updates for 24 hours, and the SIE routine runs once a
# day at noon -- so a reply sent late morning would expire before it was read.
# This polls every ~15 minutes, saves SIE messages to state/sie/inbox.jsonl
# (read by the noon routine, never written by it), and replies with an
# instant score from the answer key the routine stored.
#
# Scheduled workflows are best-effort, and GitHub runs this repo's schedules
# hours late (Nov 2026: the CFA Math release's 09:37 UTC cron fired at 16:00-21:30
# every day). So every push to main also polls -- including each morning's lesson
# publish -- and no reply sits unread past Telegram's 24-hour limit. The inbox's
# own pushes use GITHUB_TOKEN, which never triggers a workflow, so this cannot loop.
# Commits only when an SIE message actually arrived, and state/ changes never
# trigger the site build or the edition notification.
#
# Since 2026-11-15 it also saves messages that start with "CFA" -- Logan's
# nightly study reports for the CFA Morning Lesson -- to state/cfa1/inbox.jsonl,
# read by the 4:50 AM routine (prompts/cfa-morning.md), never written by it.
#
# The acknowledgement is the only Telegram message outside notify.py, and it
# is still sent by Actions, never by a routine (shared-rules section 14).

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sie-inbox
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      # A plain path: job-level env cannot use the runner context. Until
      # 2026-11-15 this line used the runner.temp expression, so GitHub rejected the
      # whole file and the inbox never ran (every push showed a failed run).
      SIE_PENDING: /tmp/sie-pending.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Collect SIE and CFA replies
        run: python3 .github/scripts/sie_inbox.py collect

      - name: Persist the inbox
        run: |
          if git diff --quiet -- state/sie/inbox.jsonl state/cfa1/inbox.jsonl; then
            echo "no new SIE or CFA messages"
            exit 0
          fi
          git config user.name  "Intelligence Terminal Bot"
          git config user.email "loganshaffer87@gmail.com"
          git add state/sie/inbox.jsonl state/cfa1/inbox.jsonl
          git commit -m "inbox: telegram replies"
          # A report run may be pushing at the same moment. The inbox is
          # append-only and written only here, so a rebase never conflicts.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "push race, retry $i"; sleep 10
          done
          echo "could not push the inbox; updates stay unconfirmed and are retried next poll" >&2
          exit 1

      # Runs only if the inbox is safely on main: replying before that could
      # acknowledge an answer that was then lost.
      - name: Reply and confirm
        run: python3 .github/scripts/sie_inbox.py confirm
