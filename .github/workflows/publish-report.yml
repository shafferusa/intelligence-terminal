name: Publish report (auto-merge claude/ PRs)

# Routine runs that cannot push directly to main (branch-push restriction) push a
# claude/report-* branch and open a PR. This workflow merges it; the "Build & deploy
# site" workflow then runs via its workflow_run trigger (on the main ref, which the
# github-pages environment protection allows), deploys, and sends the Telegram
# notification after the page is live.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-report
  cancel-in-progress: false

jobs:
  merge:
    # Same-repo claude/ branches only — never fork PRs.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'claude/')
    runs-on: ubuntu-latest
    steps:
      - name: Merge the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --repo "${{ github.repository }}" --squash --delete-branch
