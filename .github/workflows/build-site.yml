name: Build & deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_dispatch:
  # PR-path publishes: after publish-report merges a claude/* report PR, this
  # workflow_run trigger rebuilds and deploys from main (merges made with
  # GITHUB_TOKEN never fire push events, and the github-pages environment only
  # allows deploys from main — which workflow_run satisfies).
  workflow_run:
    workflows: ["Publish report (auto-merge claude/ PRs)"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read   # the notify job checks what a merged PR changed
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # state/ lives outside the served site root, so the status page cannot
      # fetch the run log directly. Copy it in at build time.
      - name: Publish run log for the status page
        run: cp state/run-log.jsonl site/status.jsonl || echo "no run log yet"

      # site/assets/* is served cache-first by the service worker, so an
      # installed PWA keeps the old file until the cache KEY changes. Bumping
      # that key by hand was the documented rule and it was missed the very
      # next time assets changed: the MP3 player shipped in report.js while
      # sw.js still said ldn-cache-v2, so every phone kept running the
      # pre-MP3 player and silently ignored audio that was being published
      # correctly every day.
      #
      # So derive it instead. The key is now a hash of the asset bytes: change
      # any asset and the cache key changes with it, forget to do anything and
      # it still works. Only the deployed copy is rewritten; the value in the
      # repo stays a readable fallback.
      - name: Stamp the service-worker cache key with an asset hash
        run: |
          HASH=$(find site/assets -type f -exec sha256sum {} \; \
                 | sort | sha256sum | cut -c1-12)
          sed -i "s/^var VERSION = \".*\";/var VERSION = \"ldn-cache-$HASH\";/" site/sw.js
          echo "cache key: ldn-cache-$HASH"
          grep -n '^var VERSION' site/sw.js

      # Release assets serve Content-Type: application/octet-stream with
      # Content-Disposition: attachment. Chrome sniffs past that; iOS Safari
      # does not, and refuses to play it in an <audio> element -- so the
      # player fell back to browser speech on the one device this exists for,
      # every time, while the MP3 sat there correct and unplayable.
      #
      # Pages serves .mp3 as audio/mpeg, inline, same-origin, with range
      # requests. So copy the recent audio into the artifact at build time.
      # Releases stay the storage -- nothing is committed, git stays clean,
      # and only the last few days ride along in the deploy.
      - name: Stage recent audio for same-origin playback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/audio
          gh release list --limit 8 --json tagName \
            --jq '.[] | select(.tagName | startswith("audio-")) | .tagName' \
          | while read -r tag; do
              gh release download "$tag" --dir site/audio --clobber || \
                echo "no asset on $tag"
            done
          echo "staged:"; ls -lh site/audio/ 2>/dev/null || echo "  (none yet)"

      - name: Build Pagefind search index
        run: npx -y pagefind --site site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Telegram notification for PR-path publishes only — sent AFTER the deploy so the
  # link is live. Direct-push publishes are notified by notify-telegram.yml instead.
  notify:
    if: github.event_name == 'workflow_run'
    needs: deploy
    runs-on: ubuntu-latest
    # notify.py also waits here for the report MP3 (audio.yml runs off the same
    # publish-report completion, in parallel with this deploy).
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      # Every merged claude/* PR completes "Publish report", including
      # maintenance PRs (code, docs, curriculum) that publish nothing. Without
      # this check such a merge re-sent whatever the newest edition happened
      # to be (caught 2026-09-25 when the SIE Program PR merged). Ask GitHub
      # which files the merged PR changed; only an edition touches the index.
      # Any doubt (no PR number, API error) falls back to the old behaviour.
      - name: Did this merge publish an edition?
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          yes=true
          # The PR list in the event can come back empty once the merged
          # branch is deleted; the commit still knows its pull request.
          if [ "$EVENT" = "workflow_run" ] && [ -z "$PR" ] && [ -n "$HEAD_SHA" ]; then
            PR=$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA/pulls" --jq '.[0].number' 2>/dev/null || true)
          fi
          if [ "$EVENT" = "workflow_run" ] && [ -n "$PR" ]; then
            if files=$(gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate --jq '.[].filename'); then
              if ! printf '%s\n' "$files" | grep -qx 'site/reports/index.json'; then
                echo "PR #$PR changed no edition -- maintenance merge, skipping"
                yes=false
              fi
            else
              echo "could not list PR #$PR files -- proceeding as before"
            fi
          fi
          echo "yes=$yes" >> "$GITHUB_OUTPUT"

      - name: Send Telegram notification
        if: steps.published.outputs.yes == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/notify.py
