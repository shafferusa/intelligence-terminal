name: Build & deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_dispatch:
  # PR-path publishes: after publish-report merges a claude/* report PR, this
  # workflow_run trigger rebuilds and deploys from main (merges made with
  # GITHUB_TOKEN never fire push events, and the github-pages environment only
  # allows deploys from main — which workflow_run satisfies).
  workflow_run:
    workflows: ["Publish report (auto-merge claude/ PRs)"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Pagefind search index
        run: npx -y pagefind --site site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Telegram notification for PR-path publishes only — sent AFTER the deploy so the
  # link is live. Direct-push publishes are notified by notify-telegram.yml instead.
  notify:
    if: github.event_name == 'workflow_run'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Send Telegram notification
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'EOF'
          import json, html, os, urllib.request, sys
          idx = json.load(open('site/reports/index.json', encoding='utf-8'))
          if not idx:
              print('index.json empty — nothing to announce'); sys.exit(0)
          r = idx[0]
          base = 'https://shafferusa.github.io/intelligence-terminal/'
          url = base + r['path']
          title = html.escape(r.get('title', 'New report'))
          summary = html.escape(r.get('summary', ''))
          mins = r.get('reading_minutes')
          tail = f'\n\n<a href="{url}">Open the full report</a>'
          if mins: tail += f' · {mins} min read'
          text = f'<b>{title}</b>\n\n{summary}{tail}'
          body = json.dumps({'chat_id': os.environ['TG_CHAT'], 'text': text[:4096],
                             'parse_mode': 'HTML',
                             'link_preview_options': {'is_disabled': True}}).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TG_TOKEN']}/sendMessage",
              data=body, headers={'Content-Type': 'application/json'})
          resp = json.load(urllib.request.urlopen(req))
          print('telegram ok:', resp.get('ok'))
          sys.exit(0 if resp.get('ok') else 1)
          EOF
