name: Notify Telegram on direct publish

# Direct-push publishes: the routine pushes the report straight to main and
# this workflow announces it.
#
# There is no duplicate guard any more, and none is needed. The routine used
# to send its own message too, with a guard here meant to suppress the second
# one -- but that guard read state/run-log.jsonl at the report commit, and the
# routine writes its run-log line in a LATER commit, so the guard always read
# the previous run and never fired. Every edition the routine notified itself
# arrived twice (mornings, Saturdays, Sundays).
#
# Fixed at the source: shared-rules section 14 now forbids the routine from
# sending at all. Actions is the only sender.
#
# PR-path publishes never reach this workflow -- their merge commits are made
# with GITHUB_TOKEN, which does not trigger push events; build-site.yml
# notifies for that path instead.
#
# This (direct-push) path is correctly scoped: the paths filter means it only
# fires when an edition actually changes site/reports/index.json. The bug was on
# the OTHER path: build-site.yml's workflow_run notify job fired for EVERY
# auto-merged claude/* PR and re-announced the latest edition, so any non-report
# PR merge produced a duplicate brief. Fixed 2026-09-25 by (a) narrowing
# publish-report.yml to auto-merge only claude/report-* branches and (b) gating
# build-site.yml's notify job on an actual index.json change. So the two senders
# stay effectively exclusive per real edition -- but by construction now, not by
# the earlier assumption that a non-report claude/* merge could never notify.

on:
  push:
    branches: [main]
    paths: [site/reports/index.json]

permissions:
  contents: read

concurrency:
  group: notify-telegram
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    # notify.py holds the push for up to 20 min waiting on the report MP3, so
    # this job is mostly spent idling on purpose. The cap sits above that wait
    # so the timeout can only ever fire on a genuine hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Send Telegram notification
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Read-only, and only for the releases API the audio wait polls.
          # Runners share public IPs, so the anonymous 60/hour limit is not
          # ours alone to spend.
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/notify.py
