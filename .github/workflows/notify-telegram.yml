name: Notify Telegram on direct publish

# Direct-push publishes: the routine pushes the report straight to main and
# this workflow announces it.
#
# There is no duplicate guard any more, and none is needed. The routine used
# to send its own message too, with a guard here meant to suppress the second
# one -- but that guard read state/run-log.jsonl at the report commit, and the
# routine writes its run-log line in a LATER commit, so the guard always read
# the previous run and never fired. Every edition the routine notified itself
# arrived twice (mornings, Saturdays, Sundays).
#
# Fixed at the source: shared-rules section 14 now forbids the routine from
# sending at all. Actions is the only sender.
#
# PR-path publishes never reach this workflow -- their merge commits are made
# with GITHUB_TOKEN, which does not trigger push events; build-site.yml
# notifies for that path instead. The two are mutually exclusive.

on:
  push:
    branches: [main]
    paths: [site/reports/index.json]

permissions:
  contents: read

concurrency:
  group: notify-telegram
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send Telegram notification
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 .github/scripts/notify.py
