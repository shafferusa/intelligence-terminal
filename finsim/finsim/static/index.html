<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>finsim — institutional finance simulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FinSim">
<meta name="application-name" content="FinSim">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <header>
    <span class="logo">FINSIM<small>simulation</small></span>
    <select id="worldSel" title="World"></select>
    <button class="btn" id="newWorldBtn">+ Save</button>
    <button class="btn" id="savesBtn" title="manage saves: delete">Saves</button>
    <select id="pfSel" title="Portfolio"></select>
    <button class="btn" id="newPfBtn">+ Book</button>
    <span class="search"><input id="tickerQ" placeholder="ticker or name  ( / )" autocomplete="off" spellcheck="false"><div id="tickerDD" style="display:none"></div></span>
    <span class="spacer"></span>
    <span id="regimeBadge" class="badge"></span>
    <span id="realBadge" class="badge blue" style="display:none"></span>
    <span id="nextUpdate" class="mono" style="color:var(--fg2);font-size:11px"></span>
    <span class="simdate" id="simDate">—</span>
    <button class="btn primary" data-adv="1">Advance 1D</button>
    <button class="btn" data-adv="5">1W</button>
    <button class="btn" data-adv="21">1M</button>
  </header>
  <div id="banner" style="display:none"></div>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script src="/glossary.js"></script>
<script src="/app.js"></script>
</body>
</html>
